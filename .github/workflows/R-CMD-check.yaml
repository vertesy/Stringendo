# CI for Stringendo: builds the package and runs `R CMD check` on every
# push and pull request against main/dev, on a clean Ubuntu + R-release runner.
#
# Stringendo's own dependencies (clipr, dplyr) are on CRAN. Its two
# GitHub-only @vertesy packages (MarkdownHelpers, MarkdownReports) are
# listed as Suggests, so they're listed explicitly below to make sure
# the dependency installer (pak) fetches them from GitHub, not CRAN.
#
# Based on the standard r-lib/actions check-standard workflow:
# https://github.com/r-lib/actions/tree/v2-branch/examples#standard-ci-workflow

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: |
            any::rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
